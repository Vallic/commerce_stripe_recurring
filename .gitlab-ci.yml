################
# GitLab CI for Commerce Stripe Recurring, on the Drupal Association's
# templates.
#
# The templates are kept up to date centrally; see
# https://project.pages.drupalcode.org/gitlab_templates/ for every variable.
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # Drupal 11 on PHP 8.4 is the baseline; also test the next major, so the
  # code stays ready for Drupal 12.
  _TARGET_PHP: '8.4'
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_PREVIOUS_MAJOR: 0
  # Opting in only offers the variant as manual jobs; run them on every push
  # and merge request.
  _AUTORUN_NEXT_MAJOR: 'all'
  # Dependencies without a Drupal 12 release yet, so the next major jobs can
  # install them. Commerce submodules are packages of their own here.
  _LENIENT_ALLOW_LIST: 'address,commerce,commerce_number_pattern,commerce_order,commerce_payment,commerce_price,commerce_product,commerce_store,entity,entity_reference_revisions,inline_entity_form,profile,state_machine,token'
  # Kernel tests run in separate processes; run test classes in parallel.
  _PHPUNIT_CONCURRENT: 1
  # No JavaScript or CSS to lint.
  SKIP_ESLINT: 1
  SKIP_STYLELINT: 1

# StripeMockGatewayTest talks to stripe-mock, Stripe's own double, never to
# Stripe. Setting STRIPE_MOCK_URL makes the test fail, rather than skip, when
# the service is missing. The other phpunit jobs extend this one, so they
# get the service too. Services are a list, which a job replaces rather than
# merges: the template's own are repeated.
phpunit:
  services:
    - !reference [.with-database]
    - !reference [.with-chrome]
    - !reference [.with-chrome-legacy]
    - name: stripe/stripe-mock:latest
      alias: stripe-mock
  variables:
    STRIPE_MOCK_URL: 'http://stripe-mock:12111'
